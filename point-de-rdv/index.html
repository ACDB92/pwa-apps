<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Point de RDV — Paris</title>
<meta name="theme-color" content="#1B5FCE" id="theme-meta">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg">

<style>
  :root {
    --bg: #F5F6F8; --surface: #FFFFFF; --line: #E3E6EC;
    --ink: #14171F; --muted: #667085; --faint: #98A2B3;
    --accent: #1B5FCE; --accent-soft: #E8F0FE;
    --warm: #C2410C; --warm-soft: #FFF1E7;
    --ok: #157347;
    --safe-t: env(safe-area-inset-top); --safe-b: env(safe-area-inset-bottom);
    --radius: 14px;
  }
  .dark {
    --bg: #0F1115; --surface: #171A21; --line: #262B36;
    --ink: #E9ECF1; --muted: #9AA3B2; --faint: #6B7482;
    --accent: #6BA5FF; --accent-soft: #16243B;
    --warm: #FB923C; --warm-soft: #2A1B10;
    --ok: #4ADE80;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: var(--safe-t) 0 var(--safe-b);
  }
  #app { max-width: 680px; margin: 0 auto; padding: 16px 16px 40px; }
  h1 { font-size: 21px; margin: 0; letter-spacing: -0.02em; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.07em;
       color: var(--muted); margin: 26px 0 10px; font-weight: 600; }
  p { margin: 0 0 10px; }
  .sub { color: var(--muted); font-size: 13px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
  header .grow { flex: 1; }

  button, .btn {
    font: inherit; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    border-radius: 10px; padding: 9px 13px; cursor: pointer;
  }
  button:active { transform: scale(0.985); }
  button:disabled { opacity: 0.45; cursor: default; }
  .primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600;
             width: 100%; padding: 14px; font-size: 16px; border-radius: 12px; margin-top: 18px; }
  .ghost { background: transparent; border-style: dashed; color: var(--muted); width: 100%; }
  .icon-btn { padding: 6px 9px; color: var(--muted); background: transparent; border-color: transparent; }

  .card { background: var(--surface); border: 1px solid var(--line);
          border-radius: var(--radius); padding: 14px; margin-bottom: 10px; }
  .card.tap { cursor: pointer; }
  .card.tap:hover { border-color: var(--accent); }
  .row { display: flex; align-items: center; gap: 10px; }
  .between { justify-content: space-between; }
  .wrap { flex-wrap: wrap; }

  .dot { width: 26px; height: 26px; border-radius: 50%; flex: 0 0 26px;
         display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 700; }
  .badge { display: inline-grid; place-items: center; min-width: 21px; height: 21px; padding: 0 5px;
           border-radius: 6px; font-size: 12px; font-weight: 700; line-height: 1; }
  .badges { display: inline-flex; gap: 4px; flex-wrap: wrap; vertical-align: middle; }
  .lines { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .lines .badge { min-width: 28px; height: 28px; font-size: 13px; cursor: pointer;
                  border: 1px solid transparent; }
  /* Une ligne écartée reste lisible — on doit pouvoir la retrouver pour la réactiver. */
  .badge.off { background: transparent !important; color: var(--faint) !important;
               border-color: var(--line); text-decoration: line-through; }
  /* Sans touch-action:none, un glissement sur le plan ferait défiler la page. */
  .map { touch-action: none; cursor: grab; }
  .map:active { cursor: grabbing; }
  .zoomrow { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
  .zoomrow button { width: auto; padding: 6px 12px; font-size: 14px; margin: 0; }
  .places { list-style: none; padding: 0; margin: 10px 0 0; }
  .places li { display: flex; align-items: center; gap: 8px; padding: 9px 0;
               border-top: 1px solid var(--line); }
  .places li:first-child { border-top: 0; }
  .places .who-btn { flex: 1; min-width: 0; text-align: left; background: none; border: 0;
                     padding: 0; color: inherit; cursor: pointer; font: inherit; }
  .places li[aria-current=true] .who-btn .name { color: var(--warm); }
  .places .gm { flex: 0 0 auto; font-size: 12.5px; color: var(--accent);
                text-decoration: none; white-space: nowrap; }
  .fav { flex: 0 0 auto; background: none; border: 0; cursor: pointer; font-size: 17px;
         line-height: 1; padding: 2px 4px; color: var(--faint); }
  .fav[aria-pressed=true] { color: var(--warm); }
  .keys { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; font-size: 12px;
          color: var(--muted); }
  .key { display: inline-flex; align-items: center; gap: 5px; }
  .key i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .linegroup { font-size: 11.5px; color: var(--faint); text-transform: uppercase;
               letter-spacing: .09em; margin-top: 14px; font-weight: 700; }

  .name { font-weight: 600; font-size: 16px; }
  .big { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
  .unit { font-size: 13px; font-weight: 500; color: var(--muted); }
  .counts { color: var(--muted); font-size: 13.5px; margin-top: 8px; }
  .counts b { color: var(--ink); font-weight: 600; }
  .tag { font-size: 12px; padding: 3px 8px; border-radius: 999px;
         background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .tag.warm { background: var(--warm-soft); color: var(--warm); }

  input[type=text], input[type=search] {
    font: inherit; width: 100%; padding: 11px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .seg { display: flex; gap: 6px; }
  /* Jusqu'à 6 personnes : on fait défiler la bande plutôt que de réduire les prénoms à
     quelques pixels — et le défilement reste dans le bandeau, jamais dans la page. */
  .who { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
  .who button { flex: 0 0 auto; padding: 9px 13px; font-size: 14px; white-space: nowrap; }
  .who button[aria-pressed=true] { background: var(--accent-soft); border-color: var(--accent);
                                   color: var(--accent); font-weight: 600; }
  .seg button { flex: 1; padding: 9px 4px; font-size: 14px; }
  .seg button[aria-pressed=true] { background: var(--accent-soft); border-color: var(--accent);
                                   color: var(--accent); font-weight: 600; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  label.check { display: flex; gap: 9px; align-items: center; cursor: pointer; }

  .banner { border-radius: 12px; padding: 10px 13px; font-size: 13px; margin-bottom: 14px;
            background: var(--warm-soft); color: var(--warm); border: 1px solid currentColor; }
  .note { color: var(--faint); font-size: 12px; line-height: 1.45; margin-top: 22px;
          border-top: 1px solid var(--line); padding-top: 12px; }
  .results { list-style: none; padding: 0; margin: 0; }
  .rank { color: var(--faint); font-size: 13px; font-weight: 700; width: 18px; }
  .leg { font-size: 13.5px; color: var(--muted); display: flex; gap: 6px;
         align-items: center; flex-wrap: wrap; }
  .arrow { color: var(--faint); }
  .empty { color: var(--muted); text-align: center; padding: 26px 10px; }
  svg.map { width: 100%; height: auto; display: block; border-radius: var(--radius);
            background: var(--surface); border: 1px solid var(--line); }
  .hits { margin-top: 8px; }
  .hit { display: block; width: 100%; text-align: left; margin-bottom: 6px; }
</style>

<div id="app"></div>

<script src="./data.js"></script>
<script type="module">
import { buildGraph, rank, searchStations, nearestStations, placesNear, haversineM, PROFILES }
  from './engine.js';

const DATA = window.RDV_DATA || null;
const app = document.getElementById('app');
const KEY = 'rdv';
const PEOPLE_COLORS = ['#1B5FCE', '#C2410C', '#157347', '#7C3AED', '#B91C1C', '#0E7490'];

/* ---------------------------------------------------------------- état persistant */

function freshStore() {
  return { v: 1, people: [], profile: 'both', tolerance: 8, direct: false, dark: null,
           banned: [], favs: [], skip: [] };
}
let S = freshStore();
function load() {
  try {
    const raw = JSON.parse(localStorage.getItem(KEY));
    S = raw && raw.v === 1 ? Object.assign(freshStore(), raw) : freshStore();
  } catch (e) { S = freshStore(); }
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* ---------------------------------------------------------------- utilitaires */

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const render = html => { app.innerHTML = html; window.scrollTo(0, 0); };
const mins = v => Math.round(v);

let LINES = new Map(), graph = null;

function lineBadge(id) {
  const l = LINES.get(id);
  if (!l) return '';
  const c = l.color || '#667085';
  const r = parseInt(c.slice(1, 3), 16), g = parseInt(c.slice(3, 5), 16), b = parseInt(c.slice(5, 7), 16);
  const ink = (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? '#14171F' : '#FFFFFF';
  return `<span class="badge" style="background:${c};color:${ink}">${esc(l.name)}</span>`;
}
const lineBadges = ids => `<span class="badges">${(ids || []).map(lineBadge).join('')}</span>`;

const MODES = [['metro', 'Métro'], ['rer', 'RER & Transilien'], ['tram', 'Tramway']];
// « 1, 2, 3, 10 » et non « 1, 10, 2, 3 » — et « T2 » avant « T10 », donc le nombre est
// cherché n’importe où dans le nom, pas seulement en tête. Sans chiffre (Orlyval) : à la fin.
function lineOrder(l) {
  const m = /(\d+)/.exec(l.name);
  return m ? [0, +m[1], l.name] : [1, 0, l.name];
}
function lineToggle(l) {
  const off = S.banned.includes(l.id);
  const c = l.color || '#667085';
  const r = parseInt(c.slice(1, 3), 16), g = parseInt(c.slice(3, 5), 16), b = parseInt(c.slice(5, 7), 16);
  const ink = (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? '#14171F' : '#FFFFFF';
  return `<button class="badge${off ? ' off' : ''}" data-act="ban" data-v="${esc(l.id)}"
    style="${off ? '' : `background:${c};color:${ink}`}" aria-pressed="${off}"
    title="${off ? 'Remettre' : 'Écarter'} la ligne ${esc(l.name)}">${esc(l.name)}</button>`;
}

/* Toutes les lignes, groupées par mode. On les affiche pour qu'on puisse en écarter :
   une ligne écartée disparaît du réseau, elle n'est pas seulement pénalisée. */
function linesSection() {
  const n = S.banned.length;
  return `
    <div class="sub">Touche une ligne pour l’écarter : aucun trajet ne l’empruntera.</div>
    ${MODES.map(([mode, label]) => {
      const ls = DATA.lines.filter(l => l.mode === mode)
        .sort((a, b) => { const x = lineOrder(a), y = lineOrder(b);
                          return x[0] - y[0] || x[1] - y[1] || String(x[2]).localeCompare(y[2]); });
      return ls.length ? `<div class="linegroup">${label}</div>
        <div class="lines">${ls.map(lineToggle).join('')}</div>` : '';
    }).join('')}
    ${n ? `<div class="row between" style="margin-top:14px">
        <span class="sub">${n} ligne${n > 1 ? 's' : ''} écartée${n > 1 ? 's' : ''}</span>
        <button class="ghost" style="width:auto;margin:0" data-act="unban">Tout remettre</button>
      </div>` : ''}`;
}
const personColor = i => PEOPLE_COLORS[i % PEOPLE_COLORS.length];
const initials = n => (n || '?').trim().slice(0, 2).toUpperCase();
const walkRadiusMin = () =>
  Math.round(DATA.meta.model.poiRadiusM / 1000 / DATA.meta.model.walkKmh * 60);
const originLabel = o => o.station != null ? DATA.stations[o.station].n : (o.label || 'adresse');

/* ---------------------------------------------------------------- écran : qui vient ? */

function home() {
  const enough = S.people.length >= 2;
  render(`
    <header>
      <div class="grow">
        <h1>Point de RDV</h1>
        <div class="sub">Où se retrouver quand on ne part pas du même endroit.</div>
      </div>
      <button class="icon-btn" data-act="theme" title="Thème clair / sombre">◐</button>
    </header>
    ${demoBanner()}

    <h2>Qui vient ?</h2>
    ${S.people.map((p, i) => `
      <div class="card row between tap" data-go="person" data-id="${i}"
           role="button" tabindex="0" aria-label="Modifier ${esc(p.name)}">
        <div class="row" style="min-width:0">
          <span class="dot" style="background:${personColor(i)}">${esc(initials(p.name))}</span>
          <div style="min-width:0">
            <div class="name">${esc(p.name || 'Sans nom')}</div>
            <div class="sub" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
              ${esc(originLabel(p.origin))}</div>
          </div>
        </div>
        <div class="row" style="gap:2px">
          <span class="sub" aria-hidden="true">modifier</span>
          <button class="icon-btn" data-act="remove" data-i="${i}" title="Retirer ${esc(p.name)}">✕</button>
        </div>
      </div>`).join('')}
    ${S.people.length ? '' : '<div class="empty">Ajoute au moins deux points de départ.</div>'}
    <button class="ghost" data-go="person">+ Ajouter quelqu’un</button>

    <h2>Ce qu’on cherche</h2>
    <div class="card">
      <div class="seg" role="group">
        ${Object.entries(PROFILES).map(([k, p]) =>
          `<button data-act="profile" data-v="${k}" aria-pressed="${S.profile === k}">${esc(p.label)}</button>`
        ).join('')}
      </div>
      <div style="margin-top:18px">
        <div class="row between"><span>Détour toléré</span>
          <b id="tolv">${S.tolerance} min</b></div>
        <input type="range" id="tol" min="0" max="20" step="1" value="${S.tolerance}">
        <div class="sub">Écart maximal accepté, pour le plus mal loti, par rapport au meilleur
          point possible. À 0 min, on ne propose que le plus équitable.</div>
      </div>
      <label class="check" style="margin-top:16px">
        <input type="checkbox" id="direct" ${S.direct ? 'checked' : ''}>
        <span>Privilégier les trajets sans correspondance</span>
      </label>
    </div>

    <h2>Lignes</h2>
    <div class="card" id="linesbox">${linesSection()}</div>

    <button class="primary" data-go="results" ${enough ? '' : 'disabled'}>
      ${enough ? 'Trouver le point de RDV' : 'Il faut au moins deux personnes'}</button>
    ${modelNote()}
  `);
  const tol = document.getElementById('tol');
  tol.addEventListener('input', () => {
    S.tolerance = +tol.value;
    document.getElementById('tolv').textContent = S.tolerance + ' min';
  });
  tol.addEventListener('change', save);
  document.getElementById('direct').addEventListener('change', e => {
    S.direct = e.target.checked; save();
  });
}

/* ------------------------------------------------------- écran : ajouter / modifier */

/**
 * Ajouter et modifier font exactement la même chose — choisir un prénom et un point de
 * départ — donc un seul écran. `i` absent : on ajoute. `i` présent : on modifie.
 */
function person(i) {
  const editing = i != null && S.people[i] != null;
  const p = editing ? S.people[i] : null;
  render(`
    <header>
      <button class="icon-btn" data-go="home">←</button>
      <div class="grow"><h1>${editing ? 'Modifier' : 'Ajouter un point de départ'}</h1>
        ${editing ? `<div class="sub">Départ actuel : ${esc(originLabel(p.origin))}</div>` : ''}
      </div>
    </header>
    <div class="card">
      <input type="text" id="who" placeholder="Prénom" autocomplete="off">
      <div style="height:10px"></div>
      <input type="search" id="q" autocomplete="off"
        placeholder="${editing ? 'Changer de point de départ' : 'Station, ou adresse complète'}">
      <div class="sub" style="margin-top:8px">La station marche hors ligne. Une adresse demande
        du réseau : elle est cherchée dans la Base Adresse Nationale.</div>
      <div class="hits" id="hits"></div>
    </div>
    ${editing ? `
      <button class="primary" id="save">Enregistrer</button>
      <button class="ghost" data-act="remove" data-i="${i}">Retirer cette personne</button>` : ''}
  `);
  const who = document.getElementById('who');
  const q = document.getElementById('q');
  const hits = document.getElementById('hits');
  who.value = editing ? p.name : 'Personne ' + (S.people.length + 1);
  // En modification, le prénom est le champ qu'on vient le plus souvent corriger, et il est
  // déjà rempli : on le sélectionne pour qu'une frappe le remplace.
  setTimeout(() => { if (editing) { who.focus(); who.select(); } else q.focus(); }, 50);

  const pick = origin => {
    const name = who.value.trim() || 'Sans nom';
    if (editing) S.people[i] = { name, origin };
    else S.people.push({ name, origin });
    save();
    goto('home');
  };
  // Enregistrer sans toucher au départ : renommer ne doit pas obliger à resaisir un lieu.
  if (editing) document.getElementById('save').addEventListener('click', () => pick(p.origin));

  const show = list => { hits.innerHTML = ''; list.forEach(el => hits.appendChild(el)); };
  const button = (html, onClick) => {
    const b = document.createElement('button');
    b.className = 'hit';
    b.innerHTML = html;
    b.addEventListener('click', onClick);
    return b;
  };

  let timer = null;
  q.addEventListener('input', () => {
    const text = q.value.trim();
    clearTimeout(timer);
    if (!text) { hits.innerHTML = ''; return; }
    const stations = searchStations(DATA, text);
    show(stations.map(s => button(
      `<b>${esc(s.n)}</b> ${lineBadges(s.l)}`, () => pick({ station: s.id }))));
    if (text.length >= 5) {
      timer = setTimeout(() => lookupAddress(text, { hits, show, button, pick }), 450);
    }
  });
}

async function lookupAddress(text, ctx) {
  const { hits, show, button, pick } = ctx;
  if (!hits.isConnected) return;            // l'écran a changé pendant l'attente
  const status = document.createElement('div');
  status.className = 'sub';
  status.textContent = 'Recherche de l’adresse…';
  hits.appendChild(status);
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 6000);
    const url = 'https://api-adresse.data.gouv.fr/search/?limit=4&lat=48.86&lon=2.35&q='
      + encodeURIComponent(text);
    const res = await fetch(url, { signal: ctrl.signal });
    clearTimeout(timer);
    if (!res.ok) throw new Error(res.status);
    const json = await res.json();
    if (!hits.isConnected) return;
    const found = (json.features || []).map(f => ({
      label: f.properties.label, lat: f.geometry.coordinates[1], lon: f.geometry.coordinates[0]
    })).filter(a => nearestStations(DATA, a.lat, a.lon, 1200).length > 0);
    status.remove();
    const stations = searchStations(DATA, text).map(s => button(
      `<b>${esc(s.n)}</b> ${lineBadges(s.l)}`, () => pick({ station: s.id })));
    show(stations.concat(found.map(a => button(
      `📍 ${esc(a.label)}`, () => pick({ lat: a.lat, lon: a.lon, label: a.label })))));
    if (!found.length && !stations.length) {
      const none = document.createElement('div');
      none.className = 'sub';
      none.textContent = 'Aucune station ni adresse desservie ne correspond.';
      hits.appendChild(none);
    }
  } catch (e) {
    if (hits.isConnected) {
      status.textContent = 'Recherche d’adresse indisponible (hors ligne) — choisis une station.';
    }
  }
}

/* ---------------------------------------------------------------- écran : résultats */

let LAST = null, CURRENT = null;
let MAP_VIEW = 'ensemble';   // 'ensemble' | 'zones' | index de la personne regardée
let PLACE = null;            // lieu sélectionné, montré sur le plan
let MAP_Z = 1, MAP_C = null; // zoom et centre du plan, en coordonnées projetées
let MAP_F = null;            // cadre du dernier rendu, pour convertir écran -> carte
let NEAR = [];               // lieux du quartier courant, du plus proche au plus loin

/* Un favori doit survivre à une régénération de data.js, où les index changent : on le
   repère par son nom et sa position arrondie, pas par sa place dans le tableau. */
const favKey = p => `${p.name}|${p.lat.toFixed(4)}|${p.lon.toFixed(4)}`;
const isFav = p => S.favs.some(f => favKey(f) === favKey(p));

/* Lien vers Google Maps : un simple lien, aucune clé, aucune donnée recopiée. Les faits
   viennent d’OpenStreetMap, les avis restent chez Google. */
const gmapsUrl = p =>
  'https://www.google.com/maps/search/?api=1&query=' +
  encodeURIComponent(`${p.name} ${p.lat},${p.lon}`);

function results() {
  if (S.people.length < 2) return goto('home');
  const r = rank(graph, S.people, {
    profile: S.profile, toleranceMin: S.tolerance,
    maxChanges: S.direct ? 0 : null, limit: 6, skip: S.skip
  });
  LAST = r;
  if (!r.candidates.length) {
    return render(`
      <header><button class="icon-btn" data-go="home">←</button>
        <div class="grow"><h1>Aucun point commun</h1></div></header>
      <div class="empty">Aucune station n’est joignable depuis tous les points de départ.
        ${S.banned.length
          ? `Tu écartes ${S.banned.length} ligne${S.banned.length > 1 ? 's' : ''} :
             en remettre une rouvrira sans doute le réseau.`
          : 'Vérifie les adresses saisies.'}</div>`);
  }
  const fairestShown = r.candidates.some(c => c.quartier.id === r.fairest.quartier.id);
  render(`
    <header>
      <button class="icon-btn" data-go="home">←</button>
      <div class="grow"><h1>${r.candidates.length} lieux possibles</h1>
        <div class="sub">${esc(r.profile.label)} · détour toléré ${r.tolerance} min ·
          ${S.people.length} personnes${S.banned.length
            ? ` · ${S.banned.length} ligne${S.banned.length > 1 ? 's' : ''} écartée${S.banned.length > 1 ? 's' : ''}`
            : ''}</div></div>
    </header>
    ${demoBanner()}
    ${S.skip.length ? `<div class="row between" style="margin-bottom:12px">
      <span class="sub">${S.skip.length} quartier${S.skip.length > 1 ? 's' : ''} écarté${S.skip.length > 1 ? 's' : ''}</span>
      <button class="ghost" style="width:auto;margin:0" data-act="unskip">Tout remettre</button>
    </div>` : ''}

    <h2>Le meilleur compromis</h2>
    <ul class="results">${r.candidates.map((c, i) => card(c, i, r)).join('')}</ul>

    ${fairestShown ? '' : `<h2>Le plus équitable</h2>
      <ul class="results">${card(r.fairest, -1, r)}</ul>
      <div class="sub">Personne ne dépasse ${mins(r.fairest.tmax)} min, mais le quartier est
        plus calme que les propositions ci-dessus.</div>`}
    ${modelNote()}
  `);
}

/* Les autres stations du quartier : sans elles, « Châtelet » masquerait le fait que
   Les Halles et Châtelet - Les Halles sont le même point de rendez-vous. */
function alsoStations(c) {
  const others = (c.quartier.s || []).filter(id => id !== c.station.id)
    .map(id => (DATA.stations[id] || {}).n).filter(Boolean);
  return others.length
    ? `<div class="sub" style="margin-top:4px">avec ${others.map(esc).join(', ')}</div>` : '';
}

/* Combien de VOS lieux dans ce quartier. « 101 bars » ne dit rien ; « 2 de vos lieux » dit
   tout. Le calcul est trivial : les favoris se comptent sur les doigts. */
function favsIn(q) {
  const R = DATA.meta.model.poiRadiusM;
  const sts = (q.s || []).map(id => DATA.stations[id]);
  return S.favs.filter(f => sts.some(s => haversineM(s.lat, s.lon, f.lat, f.lon) <= R));
}

function card(c, i, r) {
  const s = c.station, q = c.quartier;
  const fav = favsIn(q);
  const cost = c.cost > 0.5
    ? `<span class="tag warm">+${mins(c.cost)} min de détour</span>`
    : `<span class="tag">le plus équitable</span>`;
  return `<li class="card tap" data-go="detail" data-id="${s.id}"
    role="button" tabindex="0" aria-label="Voir le détail de ${esc(q.n)}">
    <div class="row between">
      <div class="row" style="min-width:0">
        ${i >= 0 ? `<span class="rank">${i + 1}</span>` : ''}
        <div style="min-width:0">
          <div class="name">${esc(q.n)}</div>
          <div style="margin-top:5px">${lineBadges(s.l)}</div>
          ${alsoStations(c)}
          ${fav.length ? `<div class="sub" style="margin-top:4px;color:var(--warm)">★ ${fav.length}
            de vos lieux : ${fav.slice(0, 3).map(f => esc(f.name)).join(', ')}</div>` : ''}
        </div>
      </div>
      <div style="text-align:right">
        <div class="big">${mins(c.tmax)}<span class="unit"> min</span></div>
        <div class="sub">pour le plus loin</div>
      </div>
    </div>
    <div class="counts"><b>${q.bar}</b> bars · <b>${q.eat}</b> restaurants à moins de
      ${walkRadiusMin()} min à pied</div>
    <div class="row wrap" style="margin-top:9px;gap:6px">
      ${cost}
      <span class="tag">écart ${mins(c.spread)} min entre le plus proche et le plus loin</span>
      <span class="tag">${c.changes === 0 ? 'tous en direct' : c.changes + ' correspondance'
        + (c.changes > 1 ? 's' : '') + ' au pire'}</span>
    </div>
  </li>`;
}

/* ---------------------------------------------------------------- écran : détail */

function detail(id) {
  if (!LAST) return goto('results');
  const c = LAST.candidates.find(x => x.station.id === id)
    || (LAST.fairest.station.id === id ? LAST.fairest : null);
  if (!c) return goto('results');
  CURRENT = c;
  MAP_VIEW = 'ensemble';
  PLACE = null;
  const s = c.station, q = c.quartier;
  const stations = (q.s || [s.id]).map(id => DATA.stations[id]);
  NEAR = placesNear(DATA, stations, DATA.meta.model.poiRadiusM, LAST.profile.counts);
  render(`
    <header>
      <button class="icon-btn" data-go="results">←</button>
      <div class="grow"><h1>${esc(q.n)}</h1>
        <div style="margin-top:5px">${lineBadges(s.l)}</div>
        ${alsoStations(c)}</div>
    </header>
    ${demoBanner()}
    <div class="card">
      <div class="counts" style="margin:0"><b>${q.bar}</b> bars · <b>${q.eat}</b> restaurants
        dans un rayon de ${DATA.meta.model.poiRadiusM} m</div>
    </div>
    <h2>Qui met combien de temps</h2>
    ${S.people.map((p, i) => {
      const route = c.routes[i];
      return `<div class="card">
        <div class="row between">
          <div class="row">
            <span class="dot" style="background:${personColor(i)}">${esc(initials(p.name))}</span>
            <div>
              <div class="name">${esc(p.name)}</div>
              <div class="sub">depuis ${esc(originLabel(p.origin))}</div>
            </div>
          </div>
          <div class="big">${mins(c.times[i])}<span class="unit"> min</span></div>
        </div>
        <div class="leg" style="margin-top:10px">${routeHtml(route)}</div>
      </div>`;
    }).join('')}
    <h2>Sur le plan</h2>
    <div class="who" role="group" aria-label="Quelle vue du plan">
      <button data-act="mapview" data-v="ensemble" aria-pressed="true">Ensemble</button>
      <button data-act="mapview" data-v="zones" aria-pressed="false">Zones</button>
      ${S.people.map((p, i) =>
        `<button data-act="mapview" data-v="${i}" aria-pressed="false">${esc(p.name)}</button>`
      ).join('')}
    </div>
    <div id="mapbox">${mapSvg(c, 'ensemble', null)}</div>
    <div class="zoomrow">
      <button class="ghost" data-act="mapzoom" data-v="1.8" title="Zoomer">+</button>
      <button class="ghost" data-act="mapzoom" data-v="0.55" title="Dézoomer">−</button>
      <button class="ghost" data-act="mapzoom" data-v="reset">Recadrer</button>
      <span class="sub">Molette, pincement ou glissement — les noms de stations
        apparaissent en zoomant.</span>
    </div>

    <h2>${placesTitle()}</h2>
    <div id="placebox">${placesHtml()}</div>
    <div class="zoomrow" style="margin-top:20px">
      <button class="primary" style="margin:0" data-act="share">Partager</button>
      <button class="ghost" style="margin:0;width:auto" data-act="copy">Copier le résumé</button>
      <button class="ghost" style="margin:0;width:auto" data-act="skip"
        data-v="${esc(q.id)}">Pas celui-là</button>
    </div>
    ${modelNote()}
  `);
  attachMapGestures();     // le premier rendu ne passe pas par drawMap()
}

function placesTitle() {
  return { verre: 'Les bars', manger: 'Les restaurants' }[S.profile] || 'Où aller';
}

const PLACE_SHOWN = 25;

/* La liste répond au manque le plus concret : « 108 bars » ne dit pas où aller. On trie par
   distance à pied depuis le quartier — faute de notes, c'est le seul critère qu'OpenStreetMap
   fournit de façon fiable, et les avis se lisent d'un clic chez Google. */
function placesHtml() {
  if (!NEAR.length) {
    return `<div class="empty">Aucun lieu référencé dans un rayon de
      ${DATA.meta.model.poiRadiusM} m.</div>`;
  }
  const shown = NEAR.slice(0, PLACE_SHOWN);
  const favs = NEAR.filter(isFav).length;
  return `
    <div class="sub">${NEAR.length} lieu${NEAR.length > 1 ? 'x' : ''} à moins de
      ${DATA.meta.model.poiRadiusM} m, du plus proche au plus loin${
      favs ? ` · <b>${favs} de vos favoris</b>` : ''}. Touche un nom pour le situer sur le plan.</div>
    <ul class="places">
      ${shown.map(p => `
        <li data-key="${esc(favKey(p))}" aria-current="${PLACE && favKey(PLACE) === favKey(p)}">
          <button class="who-btn" data-act="place" data-key="${esc(favKey(p))}">
            <div class="name">${esc(p.name)}</div>
            <div class="sub">${[p.cuisine && esc(p.cuisine), `${p.meters} m`,
                                p.terrace && 'terrasse', p.access && 'accessible']
                                .filter(Boolean).join(' · ')}</div>
          </button>
          <button class="fav" data-act="fav" data-key="${esc(favKey(p))}"
            aria-pressed="${isFav(p)}" title="Garder en favori">${isFav(p) ? '★' : '☆'}</button>
          <a class="gm" href="${gmapsUrl(p)}" target="_blank" rel="noopener noreferrer"
            >avis ↗</a>
        </li>`).join('')}
    </ul>
    ${NEAR.length > PLACE_SHOWN
      ? `<div class="sub" style="margin-top:8px">…et ${NEAR.length - PLACE_SHOWN} autres, plus loin.</div>`
      : ''}`;
}

function routeHtml(route) {
  if (!route || !route.legs.length) return '<span class="sub">sur place</span>';
  const parts = route.legs.map(l => l.kind === 'walk'
    ? `<span>${mins(l.minutes)} min à pied</span>`
    : `${lineBadge(l.line)}<span>${l.stops} arrêt${l.stops > 1 ? 's' : ''}</span>`);
  const tail = route.changes === 0
    ? '<span class="tag">direct</span>'
    : `<span class="tag warm">${route.changes} changement${route.changes > 1 ? 's' : ''}</span>`;
  return parts.join('<span class="arrow">→</span>') + ' ' + tail;
}

/* ---------------------------------------------------------------- plan schématique */

/* Trois vues, trois questions distinctes :
     « ensemble »  est-ce équitable ?      -> tous les trajets, une couleur par PERSONNE
     « zones »     jusqu'où peut-on aller ? -> chaque station teintée selon le plus mal loti
     un prénom     comment j'y vais ?      -> son trajet seul, aux couleurs des LIGNES
   Mélanger les deux codes couleur dans une même vue rendrait les deux illisibles. */

const ZONE_BANDS = ['#1B5FCE', '#3E8E5A', '#C08A2E', '#B4553C', '#6B6F7B'];

function originOf(p) {
  return p.origin.station != null
    ? DATA.stations[p.origin.station] : { lat: p.origin.lat, lon: p.origin.lon };
}

/* Cadre commun : projection, étendue minimale, marge, et correction du rapport pour que
   l'échelle reste identique en X et en Y — sinon le tracé apparaîtrait étiré. */
function frame(points, { minSpan = 0, margin = 0.06, height = null } = {}) {
  const zone = DATA.stations.filter(s => s.z);
  const lat0 = zone.reduce((a, s) => a + s.lat, 0) / zone.length;
  const k = Math.cos(lat0 * Math.PI / 180);
  const X = o => o.lon * k, Y = o => -o.lat;
  let x0 = Math.min(...points.map(X)), x1 = Math.max(...points.map(X));
  let y0 = Math.min(...points.map(Y)), y1 = Math.max(...points.map(Y));
  if (minSpan) {
    const span = (a, b) => { const m = (a + b) / 2, h = Math.max((b - a) / 2, minSpan / 2);
                             return [m - h, m + h]; };
    [x0, x1] = span(x0, x1); [y0, y1] = span(y0, y1);
  }
  const mx = (x1 - x0) * margin || 0.004, my = (y1 - y0) * margin || 0.004;
  x0 -= mx; x1 += mx; y0 -= my; y1 += my;

  // Zoom et déplacement interactifs : on resserre la fenêtre autour du centre courant.
  // Appliqué AVANT la correction de rapport, sinon le zoom déformerait le plan.
  if (MAP_Z !== 1 || MAP_C) {
    const cx = MAP_C ? MAP_C.x : (x0 + x1) / 2, cy = MAP_C ? MAP_C.y : (y0 + y1) / 2;
    const w = (x1 - x0) / MAP_Z, h = (y1 - y0) / MAP_Z;
    x0 = cx - w / 2; x1 = cx + w / 2; y0 = cy - h / 2; y1 = cy + h / 2;
  }

  const W = 640;
  const H = height || Math.max(220, Math.min(560, Math.round(W * (y1 - y0) / (x1 - x0 || 1))));
  const want = H / W;
  if ((y1 - y0) / (x1 - x0) < want) {
    const h = (x1 - x0) * want, m = (y0 + y1) / 2; y0 = m - h / 2; y1 = m + h / 2;
  } else {
    const w = (y1 - y0) / want, m = (x0 + x1) / 2; x0 = m - w / 2; x1 = m + w / 2;
  }
  return {
    W, H,
    px: o => ((X(o) - x0) / (x1 - x0 || 1) * W).toFixed(1),
    py: o => ((Y(o) - y0) / (y1 - y0 || 1) * H).toFixed(1),
    inBox: o => X(o) >= x0 && X(o) <= x1 && Y(o) >= y0 && Y(o) <= y1,
    widthM: (x1 - x0) * 111320,                // largeur réelle du cadre, en mètres
    box: { x0, x1, y0, y1 },
    project: o => ({ x: X(o), y: Y(o) }),
    unproject: (sx, sy) => ({ x: x0 + sx / W * (x1 - x0), y: y0 + sy / H * (y1 - y0) })
  };
}

/* Le réseau en fond. Plus la vue est chargée en information utile, plus il s'efface. */
function networkSvg(f, opacity) {
  const st = DATA.stations;
  const edges = DATA.edges
    .filter(e => e[3] !== null && st[e[0]].z && st[e[1]].z && (f.inBox(st[e[0]]) || f.inBox(st[e[1]])))
    .map(([a, b, , lid]) => {
      const l = LINES.get(lid);
      return `<line x1="${f.px(st[a])}" y1="${f.py(st[a])}" x2="${f.px(st[b])}" y2="${f.py(st[b])}"
        stroke="${(l && l.color) || '#888'}" stroke-width="2" stroke-linecap="round"
        opacity="${opacity}"/>`;
    }).join('');
  return edges;
}

/* Les noms de stations n'apparaissent qu'une fois le cadre assez serré pour qu'ils tiennent.
   Au-delà d'une quinzaine, ils se chevauchent et nuisent plus qu'ils n'aident : on garde les
   stations prioritaires (celles du trajet, l'arrivée) puis les plus desservies. */
function stationLabels(f, priority) {
  if (f.widthM > 6500) return '';
  const st = DATA.stations;
  const budget = f.widthM < 1200 ? 26 : f.widthM < 2500 ? 18 : 11;
  const prio = new Set(priority || []);
  const cands = st.filter(s => s.z && f.inBox(s))
    .sort((a, b) => (prio.has(b.id) - prio.has(a.id)) || (b.l.length - a.l.length))
    .slice(0, budget);
  return cands.map(s => {
    const x = +f.px(s), y = +f.py(s);
    return `<text x="${(x + 7).toFixed(1)}" y="${(y + 3.5).toFixed(1)}" font-size="10"
      fill="currentColor" opacity="${prio.has(s.id) ? '.95' : '.6'}"
      style="paint-order:stroke;stroke:var(--surface);stroke-width:3px"
      >${esc(s.n)}</text>`;
  }).join('');
}

function routeSvg(f, route, colour) {
  const st = DATA.stations;
  return route.legs.map(l => {
    const pts = l.stations.map(id => `${f.px(st[id])},${f.py(st[id])}`).join(' ');
    const col = colour || (l.kind === 'walk' ? 'currentColor'
                                            : ((LINES.get(l.line) || {}).color || '#888'));
    return `<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="5"
      stroke-linecap="round" stroke-linejoin="round"
      ${l.kind === 'walk' ? 'stroke-dasharray="2 8"' : ''}/>`;
  }).join('');
}

function approachSvg(f, i, route) {
  if (S.people[i].origin.station != null || !route.path.length) return '';
  const o = originOf(S.people[i]), first = DATA.stations[route.path[0]];
  return `<line x1="${f.px(o)}" y1="${f.py(o)}" x2="${f.px(first)}" y2="${f.py(first)}"
    stroke="currentColor" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>`;
}

function originSvg(f, i, big) {
  const o = originOf(S.people[i]), r = big ? 11 : 7;
  return `<circle cx="${f.px(o)}" cy="${f.py(o)}" r="${r}" fill="${personColor(i)}"
      stroke="var(--surface)" stroke-width="2"/>` +
    (big ? `<text x="${f.px(o)}" y="${(+f.py(o) + 3.5).toFixed(1)}" text-anchor="middle"
      font-size="10" font-weight="700" fill="#fff">${esc(initials(S.people[i].name))}</text>` : '');
}

function targetSvg(f, station) {
  return `<circle cx="${f.px(station)}" cy="${f.py(station)}" r="11" fill="none"
      stroke="var(--ink)" stroke-width="2.5"/>
    <circle cx="${f.px(station)}" cy="${f.py(station)}" r="4" fill="var(--ink)"/>`;
}

function placeSvg(f, place) {
  if (!place) return '';
  return `<circle cx="${f.px(place)}" cy="${f.py(place)}" r="9" fill="var(--warm)"
      stroke="var(--surface)" stroke-width="2"/>
    <text x="${f.px(place)}" y="${(+f.py(place) - 14).toFixed(1)}" text-anchor="middle"
      font-size="11" font-weight="700" fill="currentColor"
      style="paint-order:stroke;stroke:var(--surface);stroke-width:3.5px">${esc(place.name)}</text>`;
}

function mapSvg(c, view, place) {
  const st = DATA.stations;
  const routes = S.people.map((_, i) => c.routes[i]).filter(r => r && r.path.length);

  // ---- vue « zones » : chaque station teintée selon le temps du plus mal loti
  if (view === 'zones') {
    const f = MAP_F = frame(st.filter(s => s.z), { margin: 0.04 });
    const step = Math.max(LAST.tolerance, 5);
    const band = t => !isFinite(t) ? 4
      : t <= LAST.floor + step ? 0 : t <= LAST.floor + 2 * step ? 1
      : t <= LAST.floor + 4 * step ? 2 : 3;
    const dots = st.filter(s => s.z).map(s => {
      const tmax = Math.max(...LAST.times.map(t => t.arrival[s.id]));
      const b = band(tmax);
      return `<circle cx="${f.px(s)}" cy="${f.py(s)}" r="${b === 0 ? 3.4 : 2.6}"
        fill="${ZONE_BANDS[b]}" opacity="${b === 4 ? '.28' : b === 0 ? '1' : '.8'}"/>`;
    }).join('');
    const legende = [
      `moins de ${mins(LAST.floor + step)} min`, `jusqu’à ${mins(LAST.floor + 2 * step)} min`,
      `jusqu’à ${mins(LAST.floor + 4 * step)} min`, 'au-delà', 'injoignable'
    ].map((t, i) => `<span class="key"><i style="background:${ZONE_BANDS[i]}"></i>${t}</span>`).join('');
    return `<svg class="map" viewBox="0 0 ${f.W} ${f.H}" role="img"
        aria-label="Zones atteignables par tout le monde">
      ${networkSvg(f, '.12')}${dots}
      ${S.people.map((_, i) => originSvg(f, i, false)).join('')}${targetSvg(f, c.station)}</svg>
      <div class="keys">${legende}</div>
      <div class="sub" style="margin-top:4px">Chaque station est teintée par le temps de la
        personne la plus mal lotie. La première bande est le budget que tu as fixé.</div>`;
  }

  // ---- vue « une personne » : son trajet seul, aux couleurs des lignes
  if (typeof view === 'number' && c.routes[view] && c.routes[view].path.length) {
    const route = c.routes[view];
    const pts = [originOf(S.people[view]), ...route.path.map(id => st[id]), c.station];
    const f = MAP_F = frame(pts, { minSpan: 0.022, margin: 0.14, height: 430 });
    return `<svg class="map" viewBox="0 0 ${f.W} ${f.H}" role="img"
        aria-label="Trajet de ${esc(S.people[view].name)} vers ${esc(c.station.n)}">
      ${networkSvg(f, '.18')}${stationLabels(f, route.path.concat([c.station.id]))}
      ${approachSvg(f, view, route)}${routeSvg(f, route)}
      ${originSvg(f, view, true)}${targetSvg(f, c.station)}${placeSvg(f, place)}</svg>
      <div class="sub" style="margin-top:6px">Trajet de ${esc(S.people[view].name)} jusqu’à
        ${esc(c.quartier.n)} — pointillés : la marche.</div>`;
  }

  // ---- vue « ensemble » : tous les trajets, une couleur par personne
  const pts = routes.length
    ? [...S.people.map((_, i) => originOf(S.people[i])), ...routes.flatMap(r => r.path.map(id => st[id])), c.station]
    : st.filter(s => s.z);
  const f = MAP_F = frame(pts, { margin: 0.1 });
  const traces = S.people.map((_, i) => {
    const r = c.routes[i];
    if (!r || !r.path.length) return '';
    return approachSvg(f, i, r) + routeSvg(f, r, personColor(i));
  }).join('');
  return `<svg class="map" viewBox="0 0 ${f.W} ${f.H}" role="img"
      aria-label="Les trajets de chacun vers ${esc(c.station.n)}">
    ${networkSvg(f, '.15')}${stationLabels(f, [c.station.id])}${traces}
    ${S.people.map((_, i) => originSvg(f, i, true)).join('')}
    ${targetSvg(f, c.station)}${placeSvg(f, place)}</svg>
    <div class="sub" style="margin-top:6px">Une couleur par personne — l’image répond à
      « est-ce équitable ? ». Cercle noir : le lieu proposé.</div>`;
}

/* ------------------------------------------------------------ état partageable par lien */

/* L'état tient dans le hash de l'URL : pas de serveur, pas de compte, et le lien rouvre
   l'appli telle quelle chez la personne d'en face. base64url parce qu'un JSON brut dans une
   URL se fait massacrer par les messageries. */
function encodeState() {
  const st = {
    p: S.people.map(x => x.origin.station != null
      ? [x.name, x.origin.station]
      : [x.name, null, x.origin.lat, x.origin.lon, x.origin.label || '']),
    f: S.profile, t: S.tolerance, d: S.direct ? 1 : 0, b: S.banned
  };
  const bytes = new TextEncoder().encode(JSON.stringify(st));
  return btoa(String.fromCharCode(...bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function decodeState(hash) {
  try {
    const b = hash.replace(/-/g, '+').replace(/_/g, '/');
    const json = new TextDecoder().decode(
      Uint8Array.from(atob(b), ch => ch.charCodeAt(0)));
    const st = JSON.parse(json);
    if (!Array.isArray(st.p) || st.p.length < 2) return null;
    return {
      people: st.p.map(x => x[1] != null
        ? { name: x[0], origin: { station: x[1] } }
        : { name: x[0], origin: { lat: x[2], lon: x[3], label: x[4] } }),
      profile: PROFILES[st.f] ? st.f : 'both',
      tolerance: Math.max(0, Math.min(20, +st.t || 8)),
      direct: !!st.d,
      banned: Array.isArray(st.b) ? st.b : []
    };
  } catch (e) { return null; }
}

async function shareState(c) {
  const url = location.origin + location.pathname + '#' + encodeState();
  const text = `${summary(c)}\n${url}`;
  try {
    if (navigator.share) { await navigator.share({ title: 'Point de RDV', text }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  try {
    await navigator.clipboard.writeText(text);
    alert('Lien copié.');
  } catch (e) { prompt('Copier ce lien :', text); }
}

/* ---------------------------------------------------------------- résumé partageable */

function summary(c) {
  const l = c.station.l.map(id => (LINES.get(id) || {}).name).filter(Boolean).join(', ');
  const who = S.people.map((p, i) => `${p.name} ${mins(c.times[i])} min`).join(' · ');
  // On nomme le quartier, mais on dit à quelle station on arrive : c'est elle qui porte
  // les temps annoncés.
  const at = c.quartier.n === c.station.n ? c.station.n : `${c.quartier.n}, à ${c.station.n}`;
  return `RDV : ${at}${l ? ' (lignes ' + l + ')' : ''}\n${who}\n`
    + `${c.quartier.bar} bars et ${c.quartier.eat} restaurants à moins de 5 min à pied.\n`
    + `Temps estimés par un modèle, pas des horaires réels.`;
}

async function copySummary(c) {
  const text = summary(c);
  try {
    await navigator.clipboard.writeText(text);
    alert('Résumé copié.');
  } catch (e) {
    prompt('Copier ce résumé :', text);
  }
}

/* ---------------------------------------------------------------- pied de page */

function demoBanner() {
  if (!DATA.meta.partial) return '';
  return `<div class="banner" style="margin-top:14px">
    <b>Jeu de démo.</b> ${DATA.meta.stations} stations seulement, stations intermédiaires
    manquantes et comptages de lieux inventés : ces résultats ne valent rien pour un vrai
    rendez-vous. Lancer <code>python3 build/fetch_data.py</code> pour les vraies données.</div>`;
}

function modelNote() {
  const m = DATA.meta;
  return `<div class="note">Temps estimés par un modèle (vitesse par mode, attente ≈ un demi
    intervalle, ${m.model.transferMin} min par correspondance) — <b>ce ne sont pas des horaires
    réels</b>. Écart mesuré sur les trajets témoins : voir <code>build/calibration.json</code>.<br>
    Réseau et lieux : OpenStreetMap (ODbL), données du ${esc(m.generated)}.
    ${m.stations} stations, dont ${m.inZone} dans la zone, regroupées en
    ${m.quartiers || m.inZone} quartiers proposables.</div>`;
}

/* ---------------------------------------------------------------- routage */

const ROUTES = { home, person, results, detail };
function goto(name, arg) { (ROUTES[name] || home)(arg); }

document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]');
  const act = e.target.closest('[data-act]');
  // Le plus proche gagne : le bouton « retirer » vit à l'intérieur de la fiche qui ouvre
  // l'édition, et un clic dessus ne doit pas ouvrir la fiche.
  if (go && (!act || !go.contains(act))) {
    const id = go.dataset.id;
    return goto(go.dataset.go, id === undefined ? undefined : +id);
  }
  if (!act) return;
  const a = act.dataset.act;
  if (a === 'remove') { S.people.splice(+act.dataset.i, 1); save(); home(); }
  else if (a === 'profile') { S.profile = act.dataset.v; save(); home(); }
  else if (a === 'theme') { setTheme(!document.documentElement.classList.contains('dark')); }
  else if (a === 'copy' && CURRENT) copySummary(CURRENT);
  else if (a === 'skip') {
    if (!S.skip.includes(act.dataset.v)) S.skip.push(act.dataset.v);
    save(); goto('results');
  }
  else if (a === 'unskip') { S.skip = []; save(); goto('results'); }
  else if (a === 'share' && CURRENT) shareState(CURRENT);
  else if (a === 'ban') {
    const id = act.dataset.v, i = S.banned.indexOf(id);
    if (i >= 0) S.banned.splice(i, 1); else S.banned.push(id);
    refreshLines();
  }
  else if (a === 'unban') { S.banned = []; refreshLines(); }
  else if (a === 'mapview' && CURRENT) {
    const v = act.dataset.v;
    MAP_VIEW = (v === 'ensemble' || v === 'zones') ? v : +v;
    MAP_Z = 1; MAP_C = null;              // changer de vue remet le cadrage à zéro
    drawMap();
    document.querySelectorAll('[data-act="mapview"]').forEach(b =>
      b.setAttribute('aria-pressed', b.dataset.v === String(MAP_VIEW)));
  }
  else if (a === 'mapzoom' && CURRENT) {
    const k = act.dataset.v;
    if (k === 'reset') {
      MAP_Z = 1; MAP_C = null;
    } else {
      // Zoomer sans viser, c'est vouloir voir le lieu proposé — pas le milieu géométrique
      // du cadre, qui pour deux départs opposés tombe n'importe où.
      if (!MAP_C && MAP_F) MAP_C = MAP_F.project(PLACE || CURRENT.station);
      MAP_Z = Math.max(1, MAP_Z * +k);
    }
    drawMap();
  }
  else if (a === 'place' && CURRENT) {
    const k = act.dataset.key;
    PLACE = (PLACE && favKey(PLACE) === k) ? null : NEAR.find(p => favKey(p) === k) || null;
    drawMap();
    document.querySelectorAll('.places li').forEach(li =>
      li.setAttribute('aria-current', String(!!PLACE && li.dataset.key === favKey(PLACE))));
    document.getElementById('mapbox').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  else if (a === 'fav') {
    const k = act.dataset.key, p = NEAR.find(x => favKey(x) === k);
    if (p) {
      const i = S.favs.findIndex(f => favKey(f) === k);
      if (i >= 0) S.favs.splice(i, 1);
      else S.favs.push({ name: p.name, lat: p.lat, lon: p.lon, bar: p.bar });
      save();
      document.getElementById('placebox').innerHTML = placesHtml();
    }
  }
});

// Les fiches cliquables sont des div : sans ce relais, elles resteraient inatteignables
// au clavier alors qu'elles ouvrent un écran.
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const el = e.target.closest('[data-go],[data-act]');
  if (!el || el.tagName === 'BUTTON' || el.tagName === 'INPUT') return;
  e.preventDefault();
  el.click();
});

// Écarter une ligne change le réseau lui-même : le graphe est reconstruit, pas filtré après
// coup. Seule la section des lignes est redessinée, pour ne pas perdre la position de lecture.
function refreshLines() {
  graph = buildGraph(DATA, { banned: S.banned });
  save();
  const box = document.getElementById('linesbox');
  if (box) box.innerHTML = linesSection();
}

function drawMap() {
  document.getElementById('mapbox').innerHTML = mapSvg(CURRENT, MAP_VIEW, PLACE);
  attachMapGestures();
}

/* Zoom et déplacement du plan.
   Pendant le geste on ne touche qu'au viewBox — c'est un seul attribut, donc c'est fluide.
   On ne redessine qu'à la fin, parce que le zoom change ce qu'il faut AFFICHER (les noms de
   stations apparaissent) et pas seulement le cadrage : ça, un viewBox ne sait pas le faire. */
function attachMapGestures() {
  const svg = document.querySelector('#mapbox svg');
  if (!svg || !MAP_F) return;
  const base = MAP_F, W = base.W, H = base.H;
  let v = { x: 0, y: 0, w: W, h: H };
  const apply = () => svg.setAttribute('viewBox', `${v.x} ${v.y} ${v.w} ${v.h}`);

  // Bornes : on ne zoome pas au-delà du quartier, ni en deçà du cadre entier.
  const clamp = () => {
    const min = W / 40;
    v.w = Math.min(W, Math.max(min, v.w)); v.h = v.w * (H / W);
    v.x = Math.max(-W * 0.2, Math.min(W * 1.2 - v.w, v.x));
    v.y = Math.max(-H * 0.2, Math.min(H * 1.2 - v.h, v.y));
  };
  const commit = () => {
    const c = base.unproject(v.x + v.w / 2, v.y + v.h / 2);
    MAP_Z = MAP_Z * (W / v.w);
    MAP_C = c;
    drawMap();
  };

  let timer = null;
  const later = () => { clearTimeout(timer); timer = setTimeout(commit, 260); };

  const zoomAt = (sx, sy, k) => {
    const px = v.x + sx * v.w, py = v.y + sy * v.h;   // point visé, en unités du viewBox
    v.w /= k; clamp();
    v.x = px - sx * v.w; v.y = py - sy * v.h; clamp();
    apply(); later();
  };

  svg.addEventListener('wheel', e => {
    e.preventDefault();
    const r = svg.getBoundingClientRect();
    zoomAt((e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height,
           Math.exp(-e.deltaY * 0.0018));
  }, { passive: false });

  const pts = new Map();
  let last = null;
  svg.addEventListener('pointerdown', e => {
    pts.set(e.pointerId, e); svg.setPointerCapture(e.pointerId); last = null;
  });
  svg.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, e);
    const r = svg.getBoundingClientRect(), all = [...pts.values()];
    if (all.length === 1) {                                   // glisser
      if (last) {
        v.x -= (e.clientX - last.x) / r.width * v.w;
        v.y -= (e.clientY - last.y) / r.height * v.h;
        clamp(); apply();
      }
      last = { x: e.clientX, y: e.clientY };
    } else if (all.length >= 2) {                             // pincer
      const d = Math.hypot(all[0].clientX - all[1].clientX, all[0].clientY - all[1].clientY);
      if (last && last.d) {
        const mx = (all[0].clientX + all[1].clientX) / 2 - r.left;
        const my = (all[0].clientY + all[1].clientY) / 2 - r.top;
        zoomAt(mx / r.width, my / r.height, d / last.d);
      }
      last = { d };
    }
  });
  const end = e => { pts.delete(e.pointerId); last = null; if (!pts.size) later(); };
  svg.addEventListener('pointerup', end);
  svg.addEventListener('pointercancel', end);
}

function setTheme(dark) {
  S.dark = dark;
  document.documentElement.classList.toggle('dark', dark);
  document.getElementById('theme-meta').content = dark ? '#0F1115' : '#1B5FCE';
  save();
}

/* ---------------------------------------------------------------- démarrage */

if (!DATA || !DATA.stations || !DATA.stations.length) {
  app.innerHTML = `<div class="card"><h1>Données manquantes</h1>
    <p class="sub">Le fichier <code>data.js</code> n’a pas pu être chargé.
    Lancer <code>python3 build/fetch_data.py --demo</code> pour un jeu d’essai,
    ou sans <code>--demo</code> pour le vrai réseau.</p></div>`;
} else {
  load();
  // Un lien partagé prime sur l'état local : celui qui l'ouvre veut voir CE rendez-vous,
  // pas le sien. On nettoie le hash aussitôt pour ne pas figer l'appli dessus.
  const shared = location.hash.length > 1 && decodeState(location.hash.slice(1));
  if (shared) {
    Object.assign(S, shared);
    save();
    history.replaceState(null, '', location.pathname + location.search);
  }
  LINES = new Map(DATA.lines.map(l => [l.id, l]));
  graph = buildGraph(DATA, { banned: S.banned });
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  setTheme(S.dark == null ? prefersDark : S.dark);
  home();
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
</script>
