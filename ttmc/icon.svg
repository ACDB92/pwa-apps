      <stop offset="0" stop-color="#E8CE96"/>
      <stop offset="0.55" stop-color="#C8A15A"/>
      <stop offset="1" stop-color="#97722F"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.5" cy="0.38" r="0.75">
